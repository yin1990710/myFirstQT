<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>力矩量化选股平台 - 首页</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0;
         background: #f7f8fa; color: #222; }
  a { text-decoration: none; }

  /* 顶部导航栏 */
  .navbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
            gap: 16px; padding: 0 20px; height: 56px; background: #1a73e8;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .navbar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
  .navbar .brand img { height: 40px; width: auto; border-radius: 7px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #0b2545; }
  .navbar .brand .brand-text { color: #fff; font-size: 17px; font-weight: 600;
                               white-space: nowrap; }
  .navbar nav { display: flex; gap: 0; height: 100%; }
  .navbar nav a { display: flex; align-items: center; padding: 0 12px; height: 100%;
                  white-space: nowrap;
                  color: rgba(255,255,255,.88); font-size: 14px; }
  .navbar nav a:hover { background: #1558b0; color: #fff; }

  .container { max-width: 1080px; margin: 0 auto; padding: 28px 24px 60px; }

  .hero { background: linear-gradient(135deg, #1a73e8, #4a9af5); color: #fff;
          border-radius: 12px; padding: 36px 32px; margin-bottom: 28px;
          box-shadow: 0 2px 10px rgba(26,115,232,.25); }
  .hero h1 { margin: 0 0 10px; font-size: 26px; }
  .hero p { margin: 0; font-size: 14px; line-height: 1.8; color: rgba(255,255,255,.92); }
  .hero .btns { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero .btns a { padding: 9px 20px; border-radius: 6px; font-size: 14px; }
  .hero .btns .primary { background: #fff; color: #1a73e8; font-weight: 600; }
  .hero .btns .ghost { border: 1px solid rgba(255,255,255,.7); color: #fff; }

  h2.section { font-size: 19px; margin: 30px 0 14px; padding-left: 10px;
               border-left: 4px solid #1a73e8; }
  .section-sub { font-size: 13px; color: #888; margin: -8px 0 16px 12px; }

  /* 子页面切换卡片 */
  .page-tabs { display: flex; gap: 0; margin: 16px 0 20px; border-bottom: 2px solid #e0e0e0; }
  .page-tabs a { padding: 10px 24px; text-decoration: none; font-size: 15px; color: #666;
                 border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s; }
  .page-tabs a:hover { color: #1a1a1a; }
  .page-tabs a.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }

  /* 策略手风琴 */
  .strategy-list { display: flex; flex-direction: column; gap: 10px; }
  .strategy-cat { font-size: 16px; font-weight: 600; color: #1a73e8; margin: 16px 0 4px;
                   padding-bottom: 4px; border-bottom: 2px solid #e8eaed; }
  details.strategy { background: #fff; border-radius: 8px;
                     box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  details.strategy summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                             padding: 14px 18px; cursor: pointer; list-style: none;
                             font-size: 15px; font-weight: 600; user-select: none; }
  details.strategy summary::-webkit-details-marker { display: none; }
  details.strategy summary::before { content: '▶'; font-size: 10px; color: #1a73e8;
                                     transition: transform .15s ease; }
  details.strategy[open] summary::before { transform: rotate(90deg); }
  details.strategy summary:hover { background: #f2f7ff; }
  .badge { font-size: 11px; font-weight: 400; padding: 2px 8px; border-radius: 10px;
           background: #e8f0fe; color: #1a56c4; font-family: Menlo, Consolas, monospace; }
  .badge.file { background: #f1f3f4; color: #666; }
  .summary-link { margin-left: auto; font-size: 12px; font-weight: 400; color: #1a73e8; }
  .strategy-body { padding: 2px 18px 16px 38px; }
  .strategy-body pre { margin: 0; white-space: pre-wrap; word-break: break-word;
                       font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
                       font-size: 13px; line-height: 1.85; color: #444; }
  .strategy-body .to-backtest { display: inline-block; margin-top: 12px; font-size: 13px;
                                color: #1a73e8; }
  .strategy-body .to-backtest:hover { text-decoration: underline; }
  #strategyErr { color: #d93025; font-size: 14px; }

  /* 关于我们 */
  .about-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                 gap: 14px; }
  .about-card { background: #fff; border-radius: 8px; padding: 18px 20px;
                box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .about-card .k { font-size: 13px; color: #888; margin-bottom: 6px; }
  .about-card .v { font-size: 15px; color: #222; word-break: break-all; }
  .about-card .v a { color: #1a73e8; }
  .about-intro { background: #fff; border-radius: 8px; padding: 20px 24px; margin-top: 14px;
                 box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 14px; line-height: 1.9;
                 color: #444; }
  footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 36px; }
</style>
</head>
<body>

<header class="navbar">
  <a class="brand" href="/" title="力矩量化选股平台">
    <img src="/static/logo.png" alt="力矩量化选股平台logo">
    <span class="brand-text">力矩量化选股平台</span>
  </a>
  <nav>
    <a href="#strategies">选股策略</a>
    <a href="/backtest">策略回测与分析</a>
    <a href="/market-overview">大盘指标概览</a>
    <a href="/mri">A股大盘风险指数</a>
    <a href="/industry-heat">行业热度</a>
    <a href="/my_stocks">我的股票池</a>
    <a href="/stock-detail">个股详情</a>
    <a href="/etf">ETF专区</a>
    <a href="/cron">任务与数据监控</a>
    <a href="/about">关于力矩量化</a>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <p>内置多种可自定义的模型选股策略（二浪、涨停、V形反转、区间新高、高换手……），
       每日自动跑批选股并入库，支持按策略与日期范围查询回测结果、查看个股近 200 日 K 线走势。</p>
  </section>

  <h2 class="section" id="strategies">选股策略</h2>

  <div class="page-tabs">
    <a href="/#strategies" class="active">选股策略</a>
    <a href="/strategy/new">新建策略</a>
    <a href="/strategy/my">我的策略</a>
    <a href="/strategy/summary">策略总结</a>
  </div>

  <p class="section-sub">共 <span id="strategyCount">…</span> 个策略（<span id="catCount">…</span>），点击任意策略可展开查看全部选股条件</p>

  <div class="page-tabs" id="catTabs" style="display:none;"></div>

  <div class="strategy-list" id="strategyList">
    <div style="font-size:13px;color:#888;">策略列表加载中…</div>
  </div>
  <p id="strategyErr"></p>

  <footer>© 2026 luckboy · 量化选股平台 · 仅供学习研究，不构成投资建议</footer>
</main>

<script>
function esc(s) {
  return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let _cats = {};        // {category: [strategy, ...]}
let _catNames = [];    // ['条件选股', '以股选股', ...]
let _activeCat = '';

function renderCat(cat) {
  _activeCat = cat;
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = _catNames.map(c =>
    `<a href="#${encodeURIComponent(c)}" class="${c === cat ? 'active' : ''}"
        onclick="renderCat('${esc(c)}');return false;">${esc(c)}（${_cats[c].length}）</a>`
  ).join('');

  const box = document.getElementById('strategyList');
  const items = _cats[cat] || [];
  if (!items.length) {
    box.innerHTML = '<div style="font-size:13px;color:#888;">该分类下暂无策略</div>';
    return;
  }
  box.innerHTML = items.map((s, idx) => {
    const backLink = s.strategy
        ? `<a class="to-backtest" href="/backtest?strategy=${encodeURIComponent(s.strategy)}">查看「${esc(s.strategy)}」回测结果 →</a>`
        : '';
    const isFindSimilar = s.file.startsWith('find_similar_');
    const findLink = isFindSimilar
        ? `<a class="summary-link" href="/find_similar?script=${encodeURIComponent(s.file)}"
            onclick="event.stopPropagation()">以股选股 →</a>`
        : '';
    return `
    <details class="strategy" ${idx === 0 ? 'open' : ''}>
      <summary>
        <span>${esc(s.title)}</span>
        ${s.strategy ? `<span class="badge">${esc(s.strategy)}</span>` : ''}
        <span class="badge file">${esc(s.file)}</span>
        ${backLink ? `<a class="summary-link" href="/backtest?strategy=${encodeURIComponent(s.strategy)}"
                    onclick="event.stopPropagation()">回测结果 →</a>` : ''}
        ${findLink}
      </summary>
      <div class="strategy-body">
        <pre>${esc(s.doc) || '（该策略暂无选股条件说明）'}</pre>
        ${backLink}
        ${findLink}
      </div>
    </details>`;
  }).join('');
}

fetch('/api/strategies_meta').then(r => r.json()).then(d => {
  const list = d.strategies || [];
  document.getElementById('strategyCount').textContent = list.length;
  _cats = {};
  list.forEach(s => { (_cats[s.category] = _cats[s.category] || []).push(s); });
  _catNames = Object.keys(_cats);
  document.getElementById('catCount').textContent = _catNames.map(c => `${c} ${_cats[c].length} 个`).join(' · ');
  if (!list.length) {
    document.getElementById('strategyList').innerHTML = '<div style="font-size:13px;color:#888;">未发现策略文件</div>';
    return;
  }
  // 显示分类切换卡片
  if (_catNames.length > 1) {
    document.getElementById('catTabs').style.display = '';
  }
  renderCat(_catNames[0]);
}).catch(err => {
  document.getElementById('strategyErr').textContent = '策略列表加载失败: ' + err;
});
</script>
</body>
</html>
