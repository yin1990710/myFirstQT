<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>智能分析 - 力矩量化选股平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 24px;
         background: #f7f8fa; color: #222; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .navbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
            gap: 16px; padding: 0 20px; height: 56px; margin: -24px -24px 20px; background: #1a73e8;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .navbar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; text-decoration: none; }
  .navbar .brand img { height: 40px; width: auto; border-radius: 7px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #0b2545; }
  .navbar .brand .brand-text { color: #fff; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .navbar nav { display: flex; gap: 0; height: 100%; }
  .navbar nav a { display: flex; align-items: center; padding: 0 12px; height: 100%;
                  white-space: nowrap; color: rgba(255,255,255,.88); font-size: 14px; text-decoration: none; }
  .navbar nav a:hover { background: #1558b0; color: #fff; }
  .navbar nav a.active { background: #1558b0; color: #fff; font-weight: 600; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fff;
         padding: 14px 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
         margin-bottom: 12px; font-size: 13px; }
  .bar label { color: #555; white-space: nowrap; font-weight: 600; }
  .bar input[type="text"] { width: 220px; padding: 8px 10px; border: 1px solid #ccc;
                            border-radius: 6px; font-size: 14px; background: #fff; }
  .bar input[type="text"]:focus { outline: none; border-color: #1a73e8; }
  .bar select { max-width: 320px; padding: 8px 10px; border: 1px solid #ccc;
                border-radius: 6px; font-size: 14px; background: #fff; }
  .bar select:focus { outline: none; border-color: #1a73e8; }
  .bar button { padding: 8px 18px; border: none; border-radius: 6px; background: #1a73e8;
                color: #fff; font-size: 14px; cursor: pointer; }
  .bar button:hover { background: #1558b0; }
  .bar button:disabled { background: #bbb; cursor: not-allowed; }
  .bar a.open-link { font-size: 13px; color: #1a73e8; text-decoration: none; display: none; }
  .bar a.open-link:hover { text-decoration: underline; }
  #msg { font-size: 13px; color: #d93025; }
  #msg.ok { color: #0f9d58; }
  #msg a.cand { color: #1a73e8; cursor: pointer; text-decoration: underline; margin: 0 2px; }
  .hint { font-size: 12px; color: #888; }
  .bar input[type="file"] { max-width: 260px; padding: 5px 8px; border: 1px solid #ccc;
                            border-radius: 6px; font-size: 13px; background: #fff; }
  .img-item { display: inline-block; margin: 2px 12px 2px 0; cursor: pointer; white-space: nowrap; }
  .img-item input { margin-right: 4px; vertical-align: -1px; }

  .progress { height: 6px; background: #e8eaed; border-radius: 3px; overflow: hidden;
              margin-bottom: 12px; display: none; }
  .progress.show { display: block; }
  .progress .pbar { height: 100%; width: 30%; background: linear-gradient(90deg,#1a73e8,#4dabf5);
                    animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

  #reportFrame { width: 100%; height: calc(100vh - 200px); min-height: 500px; border: 1px solid #e3e5e9;
                 border-radius: 8px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08);
                 display: none; }
  .placeholder { text-align: center; padding: 80px 0; color: #999; font-size: 15px;
                 background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
</style>
</head>
<body>
<header class="navbar">
  <a class="brand" href="/" title="力矩量化选股平台">
    <img src="/static/logo.png" alt="力矩量化选股平台 logo">
    <span class="brand-text">力矩量化选股平台</span>
  </a>
  <nav>
    <a href="/#strategies">选股策略</a>
    <a href="/backtest">策略回测与分析</a>
    <a href="/market-overview">大盘指标概览</a>
    <a href="/industry-heat">行业热度</a>
    <a href="/my_stocks">我的股票池</a>
    <a href="/stock-detail">个股详情</a>
    <a href="/analyzer" class="active">智能分析</a>
    <a href="/etf">ETF专区</a>
    <a href="/cron">数据同步与监控</a>
    <a href="/about">关于力矩量化</a>
  </nav>
</header>

<h1>🤖 个股智能分析</h1>

<div class="bar">
  <label>股票代码 / 名称</label>
  <input type="text" id="code" placeholder="如 300750 / sz300750 / 宁德时代" autocomplete="off">
  <button id="btnAnalyze">智能分析</button>
  <button id="btnPdf" style="display:none">保存为 PDF</button>
  <span id="msg"></span>
  <a class="open-link" id="openLink" target="_blank" rel="noopener">↗ 新窗口打开报告</a>
  <span class="hint">报告基于最新行情与本地日K生成，约需 10~30 秒，请勿重复点击</span>
</div>

<div class="bar">
  <label>已保存报告</label>
  <select id="savedReports">
    <option value="">加载中…</option>
  </select>
  <span class="hint">选择历史分析报告，直接在下方查看</span>
</div>

<div class="bar">
  <label>上传股票截图</label>
  <input type="file" id="imgFile" accept="image/*,.png,.jpg,.jpeg,.webp,.bmp">
  <button id="btnOcr">识别图片中的股票</button>
  <button id="btnBatch" style="display:none">批量生成报告</button>
  <span class="hint">支持 K 线 / 分时 / 列表截图（含股票名称或代码），识别后可勾选批量生成分析报告</span>
</div>

<div class="bar" id="imgList" style="display:none"></div>

<div class="progress" id="progress"><div class="pbar"></div></div>

<div class="placeholder" id="placeholder">输入股票代码或名称后点击「智能分析」，报告将在此处展示</div>
<iframe id="reportFrame" title="个股智能分析报告"></iframe>

<script>
(function () {
  var codeInput = document.getElementById('code');
  var btn = document.getElementById('btnAnalyze');
  var msg = document.getElementById('msg');
  var progress = document.getElementById('progress');
  var frame = document.getElementById('reportFrame');
  var placeholder = document.getElementById('placeholder');
  var openLink = document.getElementById('openLink');
  var btnPdf = document.getElementById('btnPdf');
  var savedSel = document.getElementById('savedReports');
  var _curReport = null;   // 当前展示报告的 {name, code, date}，用于 PDF 文件名

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = ok ? 'ok' : '';
  }
  function setLoading(loading) {
    btn.disabled = loading;
    btn.textContent = loading ? '正在生成…' : '智能分析';
    progress.classList.toggle('show', loading);
  }
  function showReport(url, meta) {
    frame.src = url;
    frame.style.display = 'block';
    placeholder.style.display = 'none';
    openLink.href = url;
    openLink.style.display = 'inline-block';
    btnPdf.style.display = 'inline-block';
    _curReport = meta || null;
  }

  // 从 {名称}-{代码}-{日期}.html 文件名解析报告元信息
  function parseFnameMeta(fname) {
    var stem = (fname || '').replace(/\.html$/i, '');
    var parts = stem.split('-');
    if (parts.length >= 3) {
      return { date: parts.pop(), code: parts.pop(), name: parts.join('-') };
    }
    return { name: stem, code: '', date: '' };
  }

  function loadSavedReports(selectFname) {
    fetch('/api/stock_analyzer/reports').then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { savedSel.innerHTML = '<option value="">加载失败</option>'; return; }
      var reports = d.reports || [];
      if (!reports.length) { savedSel.innerHTML = '<option value="">暂无已保存报告</option>'; return; }
      var html = '<option value="">请选择报告…</option>';
      reports.forEach(function (r) {
        var label = r.name + (r.code ? '（' + r.code + '）' : '') + (r.date ? ' - ' + r.date : '');
        html += '<option value="' + r.fname + '"' +
                (selectFname === r.fname ? ' selected' : '') + '>' + label + '</option>';
      });
      savedSel.innerHTML = html;
    }).catch(function () {
      savedSel.innerHTML = '<option value="">加载失败</option>';
    });
  }

  savedSel.addEventListener('change', function () {
    var fname = savedSel.value;
    if (!fname) return;
    showReport('/analyzer/report/' + encodeURIComponent(fname), parseFnameMeta(fname));
  });

  // 提交单个分析请求：成功 resolve {candidates:bool, d}；失败 reject Error
  function submitAnalyze(code) {
    return fetch('/api/stock_analyzer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    }).then(function (r) {
      return r.json().then(function (d) { return { status: r.status, data: d }; });
    }).then(function (res) {
      var d = res.data || {};
      if (res.status === 401 && d.need_login) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
        throw new Error('NEED_LOGIN');
      }
      if (!d.ok) {
        if (d.candidates && d.candidates.length) return { candidates: true, d: d };
        throw new Error(d.error || '生成失败');
      }
      return { candidates: false, d: d };
    });
  }

  // 展示成功结果（报告 iframe + 刷新下拉框并选中本次报告）
  function applyResult(d) {
    var tip = '已生成：' + (d.name || d.code) + '（' + d.code + '）' + (d.date ? ' 数据截至 ' + d.date : '');
    if (d.errors && d.errors.length) { tip += '；' + d.errors.length + ' 项数据缺口已在报告中标注'; }
    setMsg(tip, true);
    showReport(d.url, { name: d.name || '', code: d.code || '', date: d.date || '' });
    var fname = (d.url || '').split('/').pop();
    loadSavedReports(fname);
  }

  function renderCandidates(d) {
    msg.innerHTML = (d.error || '匹配到多只股票，请点击选择：') + d.candidates.map(function (c) {
      return '<a class="cand" data-code="' + c.ts_code + '">' +
             c.stock_name + '（' + c.ts_code + '）</a>';
    }).join('');
  }

  function run() {
    var code = codeInput.value.trim();
    if (!code) { setMsg('请输入股票代码或名称'); codeInput.focus(); return; }
    setLoading(true); setMsg('正在提交分析任务…');
    openLink.style.display = 'none';
    btnPdf.style.display = 'none';
    _curReport = null;

    submitAnalyze(code).then(function (r) {
      if (r.candidates) { renderCandidates(r.d); return; }
      var d = r.d;
      setMsg((d.name || code) + ' 分析任务已提交，后台执行中（可切换页面，完成后自动展示）', true);
      pollTask({ task_id: d.task_id, label: d.name || code });
    }).catch(function (e) {
      if (!e || e.message !== 'NEED_LOGIN') setMsg((e && e.message) || '提交失败');
    }).finally(function () {
      setLoading(false);   // 提交完成即解除加载态，分析在后台线程执行
    });
  }

  // ---- 后台任务轮询（切换页面不中断：task_id 存 localStorage，回来自动恢复）----
  var _pollTimers = {};
  var _batch = null;   // {total, done, failed, pending:Set}
  var _PEND_KEY = 'analyzer_pending_tasks';

  function savePendingTask(tid) {
    var arr = JSON.parse(localStorage.getItem(_PEND_KEY) || '[]');
    if (arr.indexOf(tid) < 0) arr.push(tid);
    localStorage.setItem(_PEND_KEY, JSON.stringify(arr));
  }
  function removePendingTask(tid) {
    var arr = JSON.parse(localStorage.getItem(_PEND_KEY) || '[]');
    arr = arr.filter(function (x) { return x !== tid; });
    localStorage.setItem(_PEND_KEY, JSON.stringify(arr));
  }

  function stopPoll(tid) {
    clearInterval(_pollTimers[tid]);
    delete _pollTimers[tid];
    removePendingTask(tid);
  }

  function pollTask(task) {
    stopPoll(task.task_id);   // 幂等重启
    savePendingTask(task.task_id);
    setMsg(task.label + ' 分析任务已提交，后台执行中（可切换页面）', true);
    _pollTimers[task.task_id] = setInterval(function () {
      fetch('/api/stock_analyzer/status?task_id=' + encodeURIComponent(task.task_id))
      .then(function (r) {
        return r.json().then(function (d) { return { status: r.status, data: d }; });
      })
      .then(function (res) {
        var d = res.data || {};
        if (res.status === 401 && d.need_login) {
          window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
          return;
        }
        if (!d.ok) { stopPoll(task.task_id); return; }   // 任务已过期
        if (d.status === 'done') {
          stopPoll(task.task_id);
          applyResult({ code: d.code, name: d.name, url: d.url });
          markBatchDone(task.task_id, true);
        } else if (d.status === 'error') {
          stopPoll(task.task_id);
          setMsg(task.label + ' 分析失败：' + (d.error || '未知错误'));
          markBatchDone(task.task_id, false);
        } else {
          setMsg(task.label + ' 正在后台分析…（切换页面不中断）');
        }
      })
      .catch(function () { /* 网络瞬断，下轮重试 */ });
    }, 3000);
  }

  function markBatchDone(tid, ok) {
    if (!_batch) return;
    if (tid && _batch.pending.has(tid)) {
      _batch.pending.delete(tid);
      ok ? _batch.done++ : _batch.failed++;
    } else if (!tid) {
      ok ? _batch.done++ : _batch.failed++;
    }
    setMsg('批量分析：' + (_batch.done + _batch.failed) + '/' + _batch.total +
           '（成功 ' + _batch.done + '，失败 ' + _batch.failed + '）', _batch.failed === 0);
    if (_batch.pending.size === 0) {
      btnBatch.disabled = false;
      btnOcr.disabled = false;
      imgFile.disabled = false;
      setLoading(false);
      _batch = null;
    }
  }

  function restorePending() {
    var arr = JSON.parse(localStorage.getItem(_PEND_KEY) || '[]');
    if (arr.length) {
      setMsg('检测到 ' + arr.length + ' 个进行中的分析任务，正在后台继续执行…', true);
      arr.forEach(function (tid) { pollTask({ task_id: tid, label: '后台分析任务' }); });
    }
  }

  msg.addEventListener('click', function (e) {
    var a = e.target.closest('a.cand');
    if (!a) return;
    codeInput.value = a.getAttribute('data-code');
    run();
  });

  // ---- 保存为 PDF：html2canvas 截取同源 iframe 报告 + jsPDF 按 A4 分页切片（库按需懒加载） ----
  var _pdfLibs = {};
  function loadScriptOnce(key, url) {
    if (_pdfLibs[key]) return _pdfLibs[key];
    _pdfLibs[key] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { delete _pdfLibs[key]; reject(new Error('脚本加载失败: ' + url)); };
      document.head.appendChild(s);
    });
    return _pdfLibs[key];
  }

  function exportPdf() {
    if (!frame.src) return;
    var iwin = frame.contentWindow;
    var idoc = frame.contentDocument;
    if (!iwin || !idoc || !idoc.body) { alert('报告尚未加载完成，请稍后再试'); return; }
    btnPdf.disabled = true;
    var oldText = btnPdf.textContent;
    btnPdf.textContent = 'PDF 生成中…';
    Promise.all([
      loadScriptOnce('h2c', 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),
      loadScriptOnce('jspdf', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'),
    ]).then(function () {
      // 冻结报告内所有 ECharts 实例动画，确保截图帧完整
      if (iwin.echarts) {
        Array.prototype.forEach.call(idoc.querySelectorAll('div[_echarts_instance_]'), function (el) {
          var inst = iwin.echarts.getInstanceByDom(el);
          if (inst) inst.setOption({ animation: false });
        });
      }
      return html2canvas(idoc.body, {
        window: iwin,
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
      });
    }).then(function (canvas) {
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF('p', 'mm', 'a4');
      var pw = 210, ph = 297, margin = 8;
      var iw = pw - margin * 2;
      var pxPerMm = canvas.width / iw;
      var pageHpx = Math.floor((ph - margin * 2) * pxPerMm);
      var y = 0, page = 0;
      while (y < canvas.height) {
        var sliceH = Math.min(pageHpx, canvas.height - y);
        var c2 = document.createElement('canvas');
        c2.width = canvas.width;
        c2.height = sliceH;
        c2.getContext('2d').drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        if (page > 0) pdf.addPage();
        pdf.addImage(c2.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, iw, sliceH / pxPerMm);
        y += sliceH;
        page++;
      }
      var meta = _curReport || {};
      var fname = '智能分析报告'
        + (meta.name ? '_' + meta.name : '')
        + (meta.code ? '_' + meta.code : '')
        + (meta.date ? '_' + meta.date : '') + '.pdf';
      pdf.save(fname);
    }).catch(function (e) {
      alert('PDF 导出失败：' + e.message);
    }).finally(function () {
      btnPdf.disabled = false;
      btnPdf.textContent = oldText;
    });
  }

  btnPdf.addEventListener('click', exportPdf);

  // ---- 上传截图识别股票（复用 module_stock_graph_orc.py），勾选后批量生成报告 ----
  var imgFile = document.getElementById('imgFile');
  var btnOcr = document.getElementById('btnOcr');
  var btnBatch = document.getElementById('btnBatch');
  var imgList = document.getElementById('imgList');
  var _ocrStocks = [];

  function renderOcrList(stocks) {
    _ocrStocks = stocks;
    if (!stocks.length) {
      imgList.style.display = 'none';
      imgList.innerHTML = '';
      btnBatch.style.display = 'none';
      return;
    }
    imgList.style.display = 'flex';
    imgList.innerHTML = '<span style="color:#555;font-weight:600;margin-right:8px">识别结果：</span>' +
      stocks.map(function (s, i) {
        return '<label class="img-item"><input type="checkbox" data-idx="' + i + '" checked> ' +
               s.stock_name + '（' + s.ts_code + '）</label>';
      }).join('');
    btnBatch.style.display = 'inline-block';
    btnBatch.disabled = false;
  }

  btnOcr.addEventListener('click', function () {
    var f = imgFile.files && imgFile.files[0];
    if (!f) { setMsg('请先选择一张股票截图'); return; }
    btnOcr.disabled = true;
    setMsg('正在识别图片中的股票名称/代码…');
    var fd = new FormData();
    fd.append('image', f);
    fetch('/api/stock_analyzer/image_ocr', { method: 'POST', body: fd })
    .then(function (r) {
      return r.json().then(function (d) { return { status: r.status, data: d }; });
    })
    .then(function (res) {
      var d = res.data || {};
      if (res.status === 401 && d.need_login) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
        return;
      }
      if (!d.ok) { setMsg(d.error || '识别失败'); renderOcrList([]); return; }
      setMsg('识别到 ' + d.stocks.length + ' 只股票，勾选后点击「批量生成报告」', true);
      renderOcrList(d.stocks);
    })
    .catch(function (e) {
      setMsg('识别请求失败：' + e);
      renderOcrList([]);
    })
    .finally(function () { btnOcr.disabled = false; });
  });

  btnBatch.addEventListener('click', function () {
    var idxs = [];
    Array.prototype.forEach.call(imgList.querySelectorAll('input[type=checkbox]:checked'), function (cb) {
      idxs.push(parseInt(cb.getAttribute('data-idx'), 10));
    });
    var stocks = idxs.map(function (i) { return _ocrStocks[i]; });
    if (!stocks.length) { setMsg('请先勾选要生成报告的股票'); return; }
    btnBatch.disabled = true;
    btnOcr.disabled = true;
    imgFile.disabled = true;
    setLoading(true);
    _batch = { total: stocks.length, done: 0, failed: 0, pending: new Set() };
    setMsg('正在批量提交 ' + stocks.length + ' 个分析任务，后台依次执行…');
    stocks.forEach(function (s) {
      var label = s.stock_name + '（' + s.ts_code + '）';
      submitAnalyze(s.ts_code).then(function (r) {
        if (r.candidates) { renderCandidates(r.d); markBatchDone(null, false); return; }
        var tid = r.d.task_id;
        _batch.pending.add(tid);
        pollTask({ task_id: tid, label: label });
      }).catch(function (e) {
        if (!e || e.message !== 'NEED_LOGIN') setMsg(label + ' 提交失败：' + ((e && e.message) || '未知错误'));
        markBatchDone(null, false);
      });
    });
  });

  btn.addEventListener('click', run);
  codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') run();
  });
  loadSavedReports();
  restorePending();   // 恢复上次切页前未完成的后台分析任务
  codeInput.focus();
})();
</script>
</body>
</html>
