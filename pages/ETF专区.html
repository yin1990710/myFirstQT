<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF专区 - 力矩量化选股平台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fa; color: #1f2933; }

  /* 顶部导航栏 */
  .navbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
            gap: 16px; padding: 0 20px; height: 56px; background: #1a73e8;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .navbar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; text-decoration: none; }
  .navbar .brand img { height: 40px; width: auto; border-radius: 7px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #0b2545; }
  .navbar .brand .brand-text { color: #fff; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .navbar nav { display: flex; gap: 0; height: 100%; }
  .navbar nav a { display: flex; align-items: center; padding: 0 12px; height: 100%;
                  white-space: nowrap;
                  color: rgba(255,255,255,.88); font-size: 14px; text-decoration: none; }
  .navbar nav a:hover { background: #1558b0; color: #fff; }
  .navbar nav a.active { background: #1558b0; color: #fff; font-weight: 600; }

  .wrap { max-width: 1200px; margin: 24px auto 48px; padding: 0 24px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .page-head h1 { font-size: 22px; margin: 0; }
  .page-head .meta { color: #6b7684; font-size: 13px; }

  /* 筛选栏 */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
                 margin-top: 18px; background: #fff; border-radius: 10px;
                 box-shadow: 0 1px 4px rgba(16,42,72,.08); padding: 14px 18px; }
  .filter-bar label { font-size: 13px; color: #6b7684; }
  .filter-bar select, .filter-bar input[type="text"] {
    padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #fff; }
  .filter-bar select { cursor: pointer; }
  .filter-bar input[type="text"] { width: 220px; }
  .filter-bar button { padding: 6px 16px; border: none; border-radius: 6px;
                        background: #1a73e8; color: #fff; font-size: 13px;
                        cursor: pointer; font-family: inherit; }
  .filter-bar button:hover { background: #1558b0; }
  .filter-bar .hint { font-size: 12px; color: #9aa3ad; }

  /* 表格 */
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,42,72,.08);
          padding: 18px 20px; margin-top: 18px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 8px; text-align: center; border-bottom: 1px solid #edf0f4; }
  th { background: #f0f5ff; color: #1a4480; font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: #f8fafd; }
  td.code { font-family: Menlo, Consolas, monospace; color: #1a4480; }
  td.name { text-align: left; padding-left: 14px; font-weight: 500; }
  .up { color: #d83a3a; font-weight: 600; }
  .down { color: #159947; font-weight: 600; }
  .null { color: #b4bdc8; }

  /* 标签 */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px;
         font-size: 11px; background: #e8f0fe; color: #1a4480; }
  .tag.sz { background: #fef3e8; color: #a8580c; }

  /* 分页提示 */
  .footnote { color: #8a94a3; font-size: 12px; margin-top: 12px; text-align: right; }

  /* 分页控件 */
  .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
           gap: 4px; margin-top: 16px; }
  .pager button { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid #d0d7de;
                  background: #fff; color: #1f2933; border-radius: 6px; font-size: 13px;
                  cursor: pointer; font-family: inherit; }
  .pager button:hover:not(:disabled) { background: #f0f5ff; border-color: #1a73e8; }
  .pager button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; font-weight: 600; }
  .pager button:disabled { color: #c0c6cd; cursor: not-allowed; }
  .pager .ellipsis { padding: 0 4px; color: #9aa3ad; }
  .pager-info { text-align: center; color: #6b7684; font-size: 12px; margin-top: 8px; }

  /* 空态 */
  #emptyTip { display: none; padding: 40px; text-align: center; color: #9aa3ad; font-size: 14px; }
</style>
</head>
<body>

<header class="navbar">
  <a class="brand" href="/" title="力矩量化选股平台">
    <img src="/static/logo.png" alt="力矩量化选股平台 logo">
    <span class="brand-text">力矩量化选股平台</span>
  </a>
  <nav>
    <a href="/#strategies">选股策略</a>
    <a href="/backtest">回测结果查询</a>
    <a href="/cron">任务运行监控</a>
    <a href="/market">大盘整体情况</a>
    <a href="/mri">大盘风险分析报告</a>
    <a href="/etf" class="active">ETF专区</a>
    <a href="/about">关于力矩量化</a>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>📈 ETF 专区</h1>
    <div class="meta">交易日：<b id="tradeDate">--</b>　｜　共 <b id="etfCount">0</b> 只</div>
  </div>

  <div class="filter-bar">
    <label>交易所
      <select id="exchangeSel">
        <option value="">全部</option>
        <option value="SH">上交所</option>
        <option value="SZ">深交所</option>
      </select>
    </label>
    <label>关键字
      <input id="kwInput" type="text" placeholder="ETF简称/跟踪指数/管理人">
    </label>
    <button onclick="loadData()">查询</button>
    <button onclick="resetFilter()">重置</button>
    <span class="hint">提示：按最新交易日成交额降序，最多展示 500 只</span>
  </div>

  <div class="card">
    <table id="etfTable">
      <thead>
        <tr>
          <th>代码</th>
          <th class="name">名称</th>
          <th>交易所</th>
          <th>跟踪指数</th>
          <th>管理人</th>
          <th>类型</th>
          <th>上市日期</th>
          <th>前收</th>
          <th>最新价</th>
          <th>涨跌幅</th>
          <th>成交量(手)</th>
          <th>成交额(千元)</th>
        </tr>
      </thead>
      <tbody id="etfBody"></tbody>
    </table>
    <div id="emptyTip">暂无数据，请先运行 <code>update_etf_daily.py</code> 拉取 ETF 数据</div>
    <div class="footnote" id="footnote"></div>
    <div class="pager" id="pager"></div>
    <div class="pager-info" id="pagerInfo"></div>
  </div>
</main>

<script>
function fmt(n, dec) {
  if (n === null || n === undefined || n === '') return '<span class="null">--</span>';
  const v = Number(n);
  if (isNaN(v)) return '<span class="null">--</span>';
  return v.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtPct(n) {
  if (n === null || n === undefined || n === '') return '<span class="null">--</span>';
  const v = Number(n);
  if (isNaN(v)) return '<span class="null">--</span>';
  const cls = v > 0 ? 'up' : (v < 0 ? 'down' : '');
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}
function esc(s) {
  return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtDate(d) {
  if (!d) return '--';
  const s = String(d);
  return s.length === 8 ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : s;
}
function fmtVol(n) {
  if (n === null || n === undefined || n === '') return '<span class="null">--</span>';
  const v = Number(n);
  if (isNaN(v)) return '<span class="null">--</span>';
  if (v >= 10000) return (v / 10000).toFixed(2) + '万';
  return v.toFixed(0);
}
function fmtAmount(n) {
  if (n === null || n === undefined || n === '') return '<span class="null">--</span>';
  const v = Number(n);
  if (isNaN(v)) return '<span class="null">--</span>';
  if (v >= 10000) return (v / 10000).toFixed(2) + '万';
  return v.toFixed(0);
}

const PAGE_SIZE = 30;        // 每页最多展示 30 只
let _allEtfs = [];          // 当前筛选条件下的全部 ETF 数据
let _curPage = 1;           // 当前页码（从 1 开始）

function loadData() {
  const exchange = document.getElementById('exchangeSel').value;
  const keyword = document.getElementById('kwInput').value.trim();
  const params = new URLSearchParams();
  if (exchange) params.append('exchange', exchange);
  if (keyword) params.append('keyword', keyword);
  const url = '/api/etf_data?' + params.toString();

  fetch(url).then(r => r.json()).then(d => {
    if (d.error) { alert(d.error); return; }
    document.getElementById('tradeDate').textContent = fmtDate(d.trade_date);
    document.getElementById('etfCount').textContent = d.count;

    _allEtfs = d.etfs || [];
    _curPage = 1;
    renderPage();
  }).catch(err => alert('加载失败: ' + err));
}

function renderPage() {
  const tbody = document.getElementById('etfBody');
  const emptyTip = document.getElementById('emptyTip');
  const table = document.getElementById('etfTable');
  const pager = document.getElementById('pager');
  const pagerInfo = document.getElementById('pagerInfo');

  if (!_allEtfs.length) {
    tbody.innerHTML = '';
    table.style.display = 'none';
    emptyTip.style.display = 'block';
    pager.innerHTML = '';
    pagerInfo.textContent = '';
    document.getElementById('footnote').textContent = '';
    return;
  }
  table.style.display = '';
  emptyTip.style.display = 'none';

  const total = _allEtfs.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (_curPage > totalPages) _curPage = totalPages;
  const start = (_curPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageData = _allEtfs.slice(start, end);

  tbody.innerHTML = pageData.map(e => {
    const ex = e.exchange || '';
    const tagCls = ex === 'SZ' ? 'tag sz' : 'tag';
    const close = e.close !== null && e.close !== undefined ? fmt(e.close, 3) : '<span class="null">--</span>';
    return `<tr>
      <td class="code">${esc(e.ts_code)}</td>
      <td class="name">${esc(e.csname || e.cname || '--')}</td>
      <td><span class="${tagCls}">${esc(ex || '--')}</span></td>
      <td>${esc(e.index_name || '--')}</td>
      <td>${esc(e.mgr_name || '--')}</td>
      <td>${esc(e.etf_type || '--')}</td>
      <td>${fmtDate(e.list_date)}</td>
      <td>${fmt(e.pre_close, 3)}</td>
      <td>${close}</td>
      <td>${fmtPct(e.pct_chg)}</td>
      <td>${fmtVol(e.vol)}</td>
      <td>${fmtAmount(e.amount)}</td>
    </tr>`;
  }).join('');

  document.getElementById('footnote').textContent =
    `共 ${total} 条 · 按成交额降序 · 数据更新时间 ${new Date().toLocaleString('zh-CN')}`;

  renderPager(totalPages, start, end, total);
}

function renderPager(totalPages, start, end, total) {
  const pager = document.getElementById('pager');
  const pagerInfo = document.getElementById('pagerInfo');

  if (totalPages <= 1) {
    pager.innerHTML = '';
    pagerInfo.textContent = `共 ${total} 条`;
    return;
  }

  // 构建页码按钮（带省略号）
  const buttons = [];
  buttons.push(`<button onclick="goPage(1)" ${_curPage === 1 ? 'disabled' : ''}>首页</button>`);
  buttons.push(`<button onclick="goPage(${_curPage - 1})" ${_curPage === 1 ? 'disabled' : ''}>上一页</button>`);

  const pageBtns = [];
  const showPages = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) showPages.push(i);
  } else {
    showPages.push(1);
    if (_curPage > 4) showPages.push('…');
    const from = Math.max(2, _curPage - 1);
    const to = Math.min(totalPages - 1, _curPage + 1);
    for (let i = from; i <= to; i++) showPages.push(i);
    if (_curPage < totalPages - 3) showPages.push('…');
    showPages.push(totalPages);
  }
  showPages.forEach(p => {
    if (p === '…') {
      pageBtns.push(`<span class="ellipsis">…</span>`);
    } else {
      pageBtns.push(`<button class="${p === _curPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`);
    }
  });

  buttons.push(...pageBtns);
  buttons.push(`<button onclick="goPage(${_curPage + 1})" ${_curPage === totalPages ? 'disabled' : ''}>下一页</button>`);
  buttons.push(`<button onclick="goPage(${totalPages})" ${_curPage === totalPages ? 'disabled' : ''}>末页</button>`);
  pager.innerHTML = buttons.join('');
  pagerInfo.textContent = `第 ${_curPage}/${totalPages} 页 · 本页 ${start + 1}-${end} · 共 ${total} 条`;
}

function goPage(n) {
  _curPage = n;
  renderPage();
  // 滚动到表格顶部
  document.getElementById('etfTable').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetFilter() {
  document.getElementById('exchangeSel').value = '';
  document.getElementById('kwInput').value = '';
  loadData();
}

// 支持回车搜索
document.getElementById('kwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadData();
});

loadData();
</script>

</body>
</html>
