<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据完整性监控 - 力矩量化选股平台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fa; color: #1f2933; }
  .navbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
            gap: 16px; padding: 0 20px; height: 56px; background: #1a73e8;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .navbar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; text-decoration: none; }
  .navbar .brand img { height: 40px; width: auto; border-radius: 7px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #0b2545; }
  .navbar .brand .brand-text { color: #fff; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .navbar nav { display: flex; gap: 0; height: 100%; }
  .navbar nav a { display: flex; align-items: center; padding: 0 12px; height: 100%;
                  white-space: nowrap;
                  color: rgba(255,255,255,.88); font-size: 14px; text-decoration: none; }
  .navbar nav a:hover { background: #1558b0; color: #fff; }
  .navbar nav a.active { background: #1558b0; color: #fff; font-weight: 600; }

  .wrap { max-width: 1280px; margin: 24px auto 48px; padding: 0 24px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .page-head h1 { font-size: 22px; margin: 0; }
  .head-tools { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6b7684; }
  .btn { border: 1px solid #1a73e8; background: #fff; color: #1a73e8; border-radius: 6px;
         padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #eef4ff; }
  .btn.primary { background: #1a73e8; color: #fff; }
  .btn.primary:hover { background: #1558b0; }
  .date-input { width: 150px; border: 1px solid #d0d7de; border-radius: 6px;
                padding: 6px 10px; font-size: 13px; color: #3d4752; }
  .date-input:focus { outline: none; border-color: #1a73e8; }
  .date-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px;
              padding: 12px 16px; background: #fff; border-radius: 10px;
              box-shadow: 0 1px 4px rgba(16,42,72,.08); }
  .date-sep { font-size: 13px; color: #8a94a3; }

  /* Tab 切换 */
  .tabs { display: flex; gap: 0; margin-top: 18px; border-bottom: 2px solid #e0e6ed; }
  .tab { padding: 10px 24px; font-size: 14px; font-weight: 500; color: #6b7684;
         cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
         text-decoration: none; }
  .tab:hover { color: #1a73e8; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }

  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,42,72,.08);
          padding: 18px 20px; margin-top: 18px; overflow-x: auto; }
  .card h3 { margin: 0 0 4px; font-size: 15px; color: #1a4480; }
  .card .card-sub { margin: 0 0 12px; font-size: 12.5px; color: #8a94a3; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #edf0f4; white-space: nowrap; }
  th { background: #f0f5ff; color: #1a4480; font-weight: 600; }
  tbody tr:hover { background: #f8fafd; }
  td.left, th.left { text-align: left; }
  .ok { color: #159947; font-weight: 600; }
  .zero { color: #d83a3a; font-weight: 600; }
  .muted { color: #b4bdc8; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: #3d4752; }
  .loading { text-align: center; padding: 60px 0; color: #8a94a3; font-size: 15px; }
  .empty { text-align: center; color: #8a94a3; padding: 60px 0; font-size: 15px; }
</style>
</head>
<body>

<header class="navbar">
  <a class="brand" href="/" title="力矩量化选股平台">
    <img src="/static/logo.png" alt="力矩量化选股平台 logo">
    <span class="brand-text">力矩量化选股平台</span>
  </a>
  <nav>
    <a href="/#strategies">选股策略</a>
    <a href="/backtest">策略回测与分析</a>
    <a href="/market-overview">大盘指标概览</a>
    <a href="/mri">A股大盘风险指数</a>
    <a href="/etf">ETF专区</a>
    <a href="/stock-detail">个股详情</a>
    <a href="/my_stocks">我的股票池</a>
    <a href="/cron" class="active">任务与数据监控</a>
    <a href="/about">关于力矩量化</a>
  </nav>
</header>

<main class="wrap">
  <div class="tabs">
    <a class="tab" href="/manual-tasks">手动任务</a>
    <a class="tab" href="/cron">例行任务监控</a>
    <a class="tab active" href="/data-monitor">数据完整性监控</a>
  </div>

  <div class="page-head" style="margin-top:18px">
    <h1>数据完整性监控</h1>
    <div class="head-tools">
      <span id="genInfo"></span>
      <button class="btn" id="refreshBtn">立即刷新</button>
    </div>
  </div>

  <div class="date-bar">
    <span style="font-size:13px;color:#3d4752;font-weight:600;">起始日期：</span>
    <input type="date" class="date-input" id="startDate">
    <span class="date-sep">（查询该日期至最新交易日的数据）</span>
    <button class="btn primary" id="queryBtn">查询</button>
    <button class="btn" id="resetBtn">重置（最近10日）</button>
  </div>

  <div id="content">
    <div class="loading">加载中…</div>
  </div>
</main>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtYmd(s) {
  // 20260917 → 2026-09-17；已是带横杠格式则原样返回
  return s && /^\d{8}$/.test(s) ? s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8) : s;
}
function fmtNum(v) {
  if (v === null || v === undefined) return '<span class="muted">-</span>';
  return '<span class="' + (v > 0 ? 'ok' : 'zero') + '">' + Number(v).toLocaleString() + '</span>';
}

function renderCard(tbl, opts) {
  if (!tbl || !tbl.rows || tbl.rows.length <= 1) {
    return '<div class="card"><h3>' + esc(tbl ? tbl.title : '') + '</h3>'
      + '<div class="empty">暂无数据</div></div>';
  }
  var head = tbl.rows[0];
  var body = tbl.rows.slice(1);
  var html = '<div class="card"><h3>' + esc(tbl.title) + '</h3>';
  if (tbl.ref_label) {
    html += '<p class="card-sub">基准交易日：' + esc(fmtYmd(tbl.ref_label)) + '</p>';
  }
  html += '<table><thead><tr>' + head.map(function(h, i) {
    return '<th class="' + (i === 0 ? 'left' : '') + '">' + esc(h) + '</th>';
  }).join('') + '</tr></thead><tbody>';
  body.forEach(function(row) {
    html += '<tr>';
    row.forEach(function(cell, i) {
      if (i === 0 && opts && opts.firstColDate) {
        html += '<td class="left">' + esc(fmtYmd(cell)) + '</td>';
      } else if (i === 0) {
        html += '<td class="left mono">' + esc(cell) + '</td>';
      } else if (typeof cell === 'number') {
        html += '<td>' + fmtNum(cell) + '</td>';
      } else {
        html += '<td>' + (cell === null || cell === undefined
          ? '<span class="muted">-</span>' : esc(cell)) + '</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function render(d) {
  var c = document.getElementById('content');
  if (d.error) {
    c.innerHTML = '<div class="card"><div class="empty">加载失败：' + esc(d.error) + '</div></div>';
    return;
  }
  if (!d.dates || !d.dates.length) {
    c.innerHTML = '<div class="card"><div class="empty">所选范围内暂无交易日数据</div></div>';
    document.getElementById('genInfo').textContent = '';
    return;
  }
  document.getElementById('genInfo').textContent =
    '生成时间 ' + esc(d.generated_at)
      + ' · 交易日 ' + esc(fmtYmd(d.dates[0])) + ' ~ ' + esc(fmtYmd(d.dates[d.dates.length - 1]))
      + '（共 ' + d.dates.length + ' 个交易日）';

  var html = renderCard(d.stock_daily, {firstColDate: true})
           + renderCard(d.other_tables);
  c.innerHTML = html;
}

async function loadData() {
  var url = '/api/stock_data_monitor';
  var sd = document.getElementById('startDate').value;
  if (sd) url += '?start_date=' + sd.replace(/-/g, '');
  document.getElementById('content').innerHTML = '<div class="loading">加载中…</div>';
  try {
    var r = await fetch(url);
    var d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="empty">加载失败：' + esc(e.message) + '</div></div>';
  }
}

document.getElementById('queryBtn').addEventListener('click', function() {
  var sd = document.getElementById('startDate').value;
  if (!sd) { alert('请选择起始日期'); return; }
  loadData();
});
document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('startDate').value = '';
  loadData();
});
document.getElementById('refreshBtn').addEventListener('click', loadData);
loadData();
</script>
</body>
</html>
