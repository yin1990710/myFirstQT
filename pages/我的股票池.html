<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>我的股票池 - 力矩量化选股平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 24px; background: #f7f8fa; color: #222; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .navbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
            gap: 16px; padding: 0 20px; height: 56px; margin: -24px -24px 20px; background: #1a73e8;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .navbar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; text-decoration: none; }
  .navbar .brand img { height: 40px; width: auto; border-radius: 7px;
                       box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #0b2545; }
  .navbar .brand .brand-text { color: #fff; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .navbar nav { display: flex; gap: 0; height: 100%; }
  .navbar nav a { display: flex; align-items: center; padding: 0 12px; height: 100%;
                  white-space: nowrap;
                  color: rgba(255,255,255,.88); font-size: 14px; text-decoration: none; }
  .navbar nav a:hover { background: #1558b0; color: #fff; }
  .navbar nav a.active { background: #1558b0; color: #fff; font-weight: 600; }
  .page-tabs { display: flex; gap: 0; margin: 16px 0 0; border-bottom: 2px solid #e0e0e0; }
  .page-tabs a { padding: 10px 24px; text-decoration: none; font-size: 15px; color: #666;
                 border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s; }
  .page-tabs a:hover { color: #1a1a1a; }
  .page-tabs a.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #fff;
         padding: 12px 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px; }
  .bar label { font-size: 13px; color: #555; }
  .bar input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; width: 120px; }
  .bar button { padding: 6px 14px; border: none; border-radius: 6px; background: #1a73e8; color: #fff;
                font-size: 13px; cursor: pointer; }
  .bar button.reset { background: #888; }
  .bar button.remove-btn { background: #d93025; }
  .bar button.download { background: #0f9d58; }
  #count { font-size: 13px; color: #666; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 13px; }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: center; color: #888; }
  td.left, th.left { text-align: left; }
  thead th { background: #1a73e8; color: #fff; }
  tbody tr:hover { background: #eef4ff; }
  .pos { color: #d93025; }
  .neg { color: #0f9d58; }
  .null { color: #bbb; }
  .empty { text-align: center; padding: 48px 0; color: #999; }
  .empty .icon { font-size: 36px; margin-bottom: 8px; }
  /* 勾选框列 */
  td input[type="checkbox"], th input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  /* 行点击展开K线 */
  tbody tr.data-row { cursor: pointer; }
  tr.kline-row td { padding: 0; background: #fafbfc; border-bottom: 1px solid #eee; }
  .kline-inline { width: 100%; height: 340px; padding: 4px 8px 8px; }
  .kline-loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  /* 分页器 */
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end;
           background: #fff; padding: 10px 16px; border-radius: 8px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-top: 10px; font-size: 13px; color: #555; }
  .pager .info { margin-right: auto; }
  .pager button { min-width: 30px; padding: 4px 9px; border: 1px solid #ccc; border-radius: 6px;
                  background: #fff; color: #333; font-size: 13px; cursor: pointer; }
  .pager button:hover:not(:disabled):not(.active) { border-color: #1a73e8; color: #1a73e8; }
  .pager button.active { background: #1a73e8; border-color: #1a73e8; color: #fff; cursor: default; }
  .pager button:disabled { color: #bbb; cursor: not-allowed; }
  .pager .ellipsis { padding: 4px 2px; color: #999; }
  /* 短线强弱得分列 + hover 展示五维 */
  .sss-cell { text-align: center; position: relative; cursor: default; }
  .sss-val { font-weight: 600; }
  .sss-val.s-strong { color: #1a7f3c; }
  .sss-val.s-mid { color: #b07d2b; }
  .sss-val.s-weak { color: #c0392b; }
  .sss-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: #1f2430; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px;
    white-space: nowrap; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,.3); line-height: 1.6; }
  .sss-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #1f2430; }
  .sss-cell:hover .sss-tooltip { display: block; }
</style>
</head>
<body>

<header class="navbar">
  <a class="brand" href="/">
    <img src="/static/logo.png" alt="力矩量化选股平台 logo">
    <span class="brand-text">力矩量化选股平台</span>
  </a>
  <nav>
    <a href="/#strategies">选股策略</a>
    <a href="/backtest" class="active">策略回测</a>
    <a href="/market-overview">大盘指标概览</a>
    <a href="/mri">A股大盘风险指数</a>
    <a href="/etf">ETF专区</a>
    <a href="/cron">任务运行监控</a>
    <a href="/about">关于力矩量化</a>
  </nav>
</header>

<div class="page-tabs">
  <a href="/backtest">策略选股结果</a>
  <a href="/backtest_analysis">策略回测</a>
  <a href="/my_stocks" class="active">我的股票池</a>
</div>

<h1>💼 我的股票池</h1>

<div class="bar">
  <span id="count"></span>
  <button onclick="loadMyStocks()">刷新</button>
  <button class="remove-btn" onclick="removeStocks()">移除</button>
  <button class="download" onclick="downloadCsv(this)">下载CSV</button>
</div>

<div id="tableArea">
  <div class="empty">
    <div class="icon">💼</div>
    <p>点击「查询」加载股票池</p>
  </div>
</div>
<div class="pager" id="pager"></div>

<script>
// 当前登录账号（用于CSV文件命名等）
let _account = '';
// 页面加载时校验登录态后自动加载当前账号股票池（后端按 session 账号过滤）
fetch('/api/current_user').then(r => r.json()).then(d => {
  if (d.account) { _account = d.account; loadMyStocks(); }
});

function fmtPct(v) {
  if (v == null) return '<span class="null">—</span>';
  return v.toFixed(2) + '%';
}

function fmtPrice(v) {
  if (v == null) return '<span class="null">—</span>';
  return v.toFixed(2);
}

let ROWS = [];                  // 全部股票记录
const PAGE_SIZE = 20;           // 每页最多 20 条
let currentPage = 1;            // 当前页码

function loadMyStocks() {
  const area = document.getElementById('tableArea');
  area.innerHTML = '<div class="empty"><div class="icon">⏳</div><p>查询中...</p></div>';
  document.getElementById('pager').innerHTML = '';

  fetch('/api/my_stocks')
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        area.innerHTML = '<div class="empty"><div class="icon">❌</div><p>' + data.error + '</p></div>';
        return;
      }
      ROWS = data.rows || [];
      document.getElementById('count').textContent = '共 ' + data.total + ' 只';
      currentPage = 1;
      renderTable();
    })
    .catch(() => {
      area.innerHTML = '<div class="empty"><div class="icon">❌</div><p>请求失败，请重试</p></div>';
    });
}

function renderTable() {
  const area = document.getElementById('tableArea');
  if (!ROWS.length) {
    area.innerHTML = '<div class="empty"><div class="icon">📭</div><p>股票池为空</p></div>';
    document.getElementById('pager').innerHTML = '';
    return;
  }
  const totalPages = Math.ceil(ROWS.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = ROWS.slice(start, start + PAGE_SIZE);

  let html = '<table><thead><tr>';
  html += '<th><input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"></th>';
  html += '<th class="left">股票代码</th><th class="left">股票名称</th>';
  html += '<th>入选日期</th><th>入选价</th><th>至今收盘</th>';
  html += '<th>区间最高</th><th>区间最低</th>';
  html += '<th>区间最大涨幅</th><th>区间最大跌幅</th><th>至今涨幅</th><th><a href="/sss/framework" target="_blank" style="color:inherit;text-decoration:none" title="点击查看说明">短线强弱得分</a><sup style="font-size:11px;color:#aaa;cursor:help;margin-left:2px" title="点击查看说明">?</sup></th>';
  html += '<th class="left">入选策略</th>';
  html += '</tr></thead><tbody>';
  pageRows.forEach(r => {
    html += '<tr class="data-row">';
    html += '<td><input type="checkbox" class="row-cb" data-code="' + r.ts_code + '" data-name="' + (r.stock_name||'').replace(/"/g,'&quot;') + '"></td>';
    html += '<td class="left">' + r.ts_code + '</td>';
    html += '<td class="left">' + (r.stock_name || '') + '</td>';
    html += '<td>' + r.selected_date + '</td>';
    html += '<td>' + fmtPrice(r.buy_price) + '</td>';
    html += '<td>' + fmtPrice(r.latest_close) + '</td>';
    html += '<td>' + fmtPrice(r.max_close) + '</td>';
    html += '<td>' + fmtPrice(r.min_close) + '</td>';
    html += '<td class="pos">' + fmtPct(r.max_gain) + '</td>';
    html += '<td class="neg">' + fmtPct(r.max_drop) + '</td>';
    const gtd = r.gain_to_date;
    html += '<td class="' + (gtd != null && gtd >= 0 ? 'pos' : 'neg') + '">' + fmtPct(gtd) + '</td>';
        html += '<td class="sss-cell" data-code="' + r.ts_code + '"><span class="null">…</span></td>';
        html += '<td class="left">' + (r.strategy_name || '—') + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  area.innerHTML = html;
  renderPager(totalPages);
  loadSSS(pageRows);
}

function renderPager(totalPages) {
  const pager = document.getElementById('pager');
  if (totalPages <= 1) { pager.innerHTML = ''; return; }
  let html = '<span class="info">第 ' + currentPage + '/' + totalPages + ' 页，共 ' + ROWS.length + ' 只</span>';
  html += '<button onclick="gotoPage(1)"' + (currentPage === 1 ? ' disabled' : '') + '>首页</button>';
  html += '<button onclick="gotoPage(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' disabled' : '') + '>上一页</button>';
  // 页码按钮
  const nums = pageNumbers(currentPage, totalPages);
  nums.forEach(n => {
    if (n === '...') html += '<span class="ellipsis">…</span>';
    else html += '<button class="' + (n === currentPage ? 'active' : '') + '" onclick="gotoPage(' + n + ')">' + n + '</button>';
  });
  html += '<button onclick="gotoPage(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>下一页</button>';
  html += '<button onclick="gotoPage(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>末页</button>';
  pager.innerHTML = html;
}

function pageNumbers(cur, total) {
  const delta = 2;
  const range = [];
  const left = Math.max(1, cur - delta);
  const right = Math.min(total, cur + delta);
  for (let i = left; i <= right; i++) range.push(i);
  if (left > 1) { range.unshift('...'); range.unshift(1); }
  if (right < total) { range.push('...'); range.push(total); }
  return range;
}

function gotoPage(n) {
  currentPage = n;
  renderTable();
}

// ---- 短线强弱得分：批量加载并填充 ----
async function loadSSS(pageRows) {
  const codes = [...new Set(pageRows.map(r => r.ts_code).filter(Boolean))];
  if (!codes.length) return;
  try {
    const d = await fetch('/api/sss_batch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({codes})
    }).then(r => r.json());
    const scores = d.scores || {};
    document.querySelectorAll('.sss-cell').forEach(td => {
      const code = td.dataset.code;
      const s = scores[code];
      if (!s || s.composite == null) {
        td.innerHTML = '<span class="null">—</span>';
        return;
      }
      const cls = s.composite >= 65 ? 's-strong' : (s.composite >= 50 ? 's-mid' : 's-weak');
      const tip = '<div class="sss-tooltip">'
        + 'RPS 相对强弱: ' + (s.rps ?? '—') + '<br>'
        + 'VPVR 量价共振: ' + (s.vpvr ?? '—') + '<br>'
        + 'TREND 趋势: ' + (s.trend ?? '—') + '<br>'
        + 'MSR 动量夏普: ' + (s.msr ?? '—') + '<br>'
        + 'MFI 主力资金: ' + (s.mfi ?? '—') + '<br>'
        + '<b>' + s.level + '</b></div>';
      td.innerHTML = '<span class="sss-val ' + cls + '">' + s.composite + '</span>' + tip;
    });
  } catch(e) {
    document.querySelectorAll('.sss-cell').forEach(td => td.innerHTML = '<span class="null">—</span>');
  }
}

// ---- 勾选框：全选 ----
function toggleAll(checked) {
  document.querySelectorAll('input.row-cb').forEach(cb => cb.checked = checked);
}

// ---- 移除选中股票 ----
function removeStocks() {
  const checked = Array.from(document.querySelectorAll('input.row-cb:checked'));
  if (!checked.length) { alert('请先勾选要移除的股票'); return; }
  const codes = checked.map(cb => cb.dataset.code);
  const names = checked.map(cb => cb.dataset.name || cb.dataset.code).join('、');
  if (!confirm('确认从股票池移除：' + names + ' ?')) return;
  fetch('/api/my_stocks/remove', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ts_codes: codes })
  }).then(r => r.json()).then(d => {
    if (d.error) { alert('移除失败: ' + d.error); return; }
    loadMyStocks();   // 刷新列表
  }).catch(e => alert('移除失败: ' + e));
}

// ---- 下载CSV：导出当前账号股票池全部记录（不受分页限制）----
function csvCell(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function fmtDateCsv(v) {
  // YYYYMMDD → YYYY-MM-DD，便于 Excel 阅读
  return v && /^\d{8}$/.test(v) ? v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6, 8) : (v || '');
}

function downloadCsv(btn) {
  if (!ROWS.length) { alert('股票池为空，没有可下载的数据'); return; }
  btn.disabled = true;
  try {
    const header = ['股票代码', '股票名称', '入选日期', '入选价', '至今收盘', '区间最高', '区间最低',
                    '区间最大涨幅(%)', '区间最大跌幅(%)', '至今涨幅(%)', '入选策略'];
    const lines = ROWS.map(r => [
      r.ts_code, r.stock_name || '', fmtDateCsv(r.selected_date),
      r.buy_price, r.latest_close, r.max_close, r.min_close,
      r.max_gain, r.max_drop, r.gain_to_date, r.strategy_name || ''
    ].map(csvCell).join(','));
    // 首部 ﻿ 为 UTF-8 BOM，保证 Excel 直接打开中文不乱码
    const csv = '﻿' + header.join(',') + '\r\n' + lines.join('\r\n');
    const today = new Date();
    const stamp = today.getFullYear()
      + String(today.getMonth() + 1).padStart(2, '0')
      + String(today.getDate()).padStart(2, '0');
    const url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url;
    // 文件名格式：账号-我的股票池-下载日期
    a.download = (_account || '未知账号') + '-我的股票池-' + stamp + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('生成CSV失败: ' + e);
  } finally {
    btn.disabled = false;
  }
}

// ---- 行点击展开/收起近120日K线图 ----
document.getElementById('tableArea').addEventListener('click', e => {
  if (e.target.closest('input[type="checkbox"]')) return;
  const tr = e.target.closest('tr.data-row');
  if (tr) toggleKlineRow(tr);
});

function disposeAllInlineCharts() {
  document.querySelectorAll('.kline-inline').forEach(el => {
    if (el._echart) { el._echart.dispose(); el._echart = null; }
    if (el._resizeHandler) { window.removeEventListener('resize', el._resizeHandler); el._resizeHandler = null; }
  });
}

function toggleKlineRow(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('kline-row')) {
    disposeAllInlineCharts();
    next.remove();
    return;
  }
  disposeAllInlineCharts();
  document.querySelectorAll('tr.kline-row').forEach(r => r.remove());
  const cb = tr.querySelector('input.row-cb');
  if (!cb) return;
  const code = cb.dataset.code;
  if (!code) return;
  const klineRow = document.createElement('tr');
  klineRow.className = 'kline-row';
  klineRow.innerHTML = '<td colspan="13"><div class="kline-inline" id="inline-chart"><div class="kline-loading">加载K线数据中…</div></div></td>';
  tr.after(klineRow);
  loadInlineKline(code, 'inline-chart');
}

async function loadInlineKline(code, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  try {
    const d = await fetch('/api/kline?code=' + encodeURIComponent(code)).then(r => r.json());
    if (d.error) { container.innerHTML = '<div class="kline-loading">' + d.error + '</div>'; return; }
    const klines = d.klines.slice(-120);
    const vols = d.vols.slice(-120);
    renderInlineChart(container, klines, vols, d.marks, code, d.stock_name);
  } catch (e) {
    container.innerHTML = '<div class="kline-loading">K线数据加载失败: ' + e + '</div>';
  }
}

function renderInlineChart(container, klines, vols, marks, code, stockName) {
  container.innerHTML = '';
  const chart = echarts.init(container);
  const rows = klines.map((k, i) => ({ ...k, vol: vols[i] }));
  const dates = rows.map(k => k.date);
  const candle = rows.map(k => k.ohlc);
  const startDate = dates.length ? dates[0] : null;
  const winMarks = startDate ? marks.filter(m => m.date >= startDate) : marks;
  const markMap = {};
  winMarks.forEach(m => { markMap[m.date] = m.strategy; });
  const volumes = rows.map(k => {
    const up = k.ohlc[1] >= k.ohlc[0];
    return { value: k.vol, itemStyle: { color: up ? '#d93025' : '#0f9d58' } };
  });

  chart.setOption({
    animation: false,
    title: { text: (stockName||'') + ' ' + code + ' 近120日K线', left: 10, top: 4,
             textStyle: { fontSize: 13, color: '#555' } },
    grid: [
      { left: 62, right: 24, top: 36, height: '55%' },
      { left: 62, right: 24, top: '72%', height: '16%' }
    ],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' },
      formatter: params => {
        if (!params || !params.length) return '';
        const date = params[0].axisValue;
        const k = rows.find(x => x.date === date);
        if (!k) return date;
        const [o, c, lo, hi] = k.ohlc;
        const pct = k.pct_chg;
        const pctColor = pct == null ? '#888' : (pct > 0 ? '#d93025' : (pct < 0 ? '#0f9d58' : '#888'));
        const pctTxt = pct == null ? '—' : (pct > 0 ? '+' : '') + pct.toFixed(2) + '%';
        const volTxt = k.vol == null ? '—' : (k.vol / 10000).toFixed(2) + ' 万手';
        let html = '<b>' + date + '</b><br/>开 ' + o + '　收 ' + c + '<br/>低 ' + lo + '　高 ' + hi
                 + '<br/>涨跌 <span style="color:' + pctColor + '">' + pctTxt + '</span>'
                 + '<br/>量 ' + volTxt;
        if (markMap[date]) html += '<br/><span style="color:#f5a623">★ 策略选中: ' + markMap[date] + '</span>';
        return html;
      }
    },
    xAxis: [
      { type: 'category', data: dates, gridIndex: 0, boundaryGap: true,
        axisLine: { onZero: false }, splitLine: { show: false }, axisLabel: { show: false } },
      { type: 'category', data: dates, gridIndex: 1, boundaryGap: true,
        axisLabel: { fontSize: 10 } }
    ],
    yAxis: [
      { scale: true, gridIndex: 0, splitArea: { show: true } },
      { scale: true, gridIndex: 1, splitNumber: 2,
        axisLabel: { formatter: v => (v / 10000).toFixed(0) + '万' } }
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
      { type: 'slider', xAxisIndex: [0, 1], top: '90%', height: 14, start: 0, end: 100 }
    ],
    series: [
      { name: '日K', type: 'candlestick', data: candle, xAxisIndex: 0, yAxisIndex: 0,
        itemStyle: { color: '#d93025', color0: '#0f9d58', borderColor: '#d93025', borderColor0: '#0f9d58' },
        markLine: {
          symbol: 'none', animation: false,
          data: winMarks.map(m => ({
            xAxis: m.date,
            lineStyle: { color: '#f5a623', type: 'dashed', width: 1.5 },
            label: { formatter: m.strategy, color: '#b26a00', fontSize: 10, position: 'insideStartTop' }
          }))
        }
      },
      { name: '成交量', type: 'bar', data: volumes, xAxisIndex: 1, yAxisIndex: 1, barWidth: '70%' }
    ]
  }, true);
  const resizeHandler = () => chart.resize();
  window.addEventListener('resize', resizeHandler);
  container._echart = chart;
  container._resizeHandler = resizeHandler;
}
</script>

</body>
</html>
