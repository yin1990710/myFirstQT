<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 力矩量化选股平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f7f8fa; display: flex; justify-content: center;
         align-items: center; min-height: 100vh; }
  .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1);
                width: 380px; padding: 40px 36px; }
  .login-card .logo { text-align: center; margin-bottom: 24px; }
  .login-card .logo img { height: 56px; border-radius: 10px; }
  .login-card h1 { font-size: 22px; text-align: center; color: #1a73e8; margin-bottom: 28px; }
  .login-card .field { margin-bottom: 18px; }
  .login-card .field label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  .login-card .field input { width: 100%; padding: 10px 12px; border: 1px solid #ddd;
                             border-radius: 8px; font-size: 15px; font-family: inherit; }
  .login-card .field input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,.15); }
  .login-card button { width: 100%; padding: 11px; border: none; border-radius: 8px;
                       background: #1a73e8; color: #fff; font-size: 16px; cursor: pointer;
                       font-family: inherit; }
  .login-card button:hover { background: #1558b0; }
  .login-card button:disabled { background: #bbb; cursor: not-allowed; }
  .login-card #msg { text-align: center; font-size: 14px; color: #d93025; margin-top: 14px;
                     min-height: 20px; }
  .login-card .hint { text-align: center; font-size: 12px; color: #aaa; margin-top: 20px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo"><img src="/static/logo.png" alt="力矩量化选股平台"></div>
  <h1>力矩量化选股平台</h1>
  <div class="field">
    <label>账号</label>
    <input id="account" type="text" placeholder="请输入账号" autofocus>
  </div>
  <div class="field">
    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码">
  </div>
  <button id="loginBtn" onclick="doLogin()">登 录</button>
  <div id="msg"></div>
  <div class="hint">登录后有效时长 3 小时，超时需重新登录</div>
</div>
<script>
function doLogin() {
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');
  if (!account || !password) { msgEl.textContent = '请输入账号和密码'; return; }
  btn.disabled = true; btn.textContent = '登录中…'; msgEl.textContent = '';
  fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ account, password })
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next;
    } else {
      msgEl.textContent = d.error || '登录失败';
    }
  }).catch(e => { msgEl.textContent = '登录失败: ' + e; })
    .finally(() => { btn.disabled = false; btn.textContent = '登 录'; });
}
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('account').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
</script>
</body>
</html>
